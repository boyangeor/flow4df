[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "flow4df"
version = "0.3.0"
authors = ["Boyan Georgiev <todo@gmail.com>"]
description = ""
readme = "README.md"
package-mode = true

[tool.poetry.dependencies]
python = "^3.11"
black = "~23.3"
pendulum = "~2.1"
pyspark = "4.1.*"
delta-spark = "4.2.*"

[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.3"

[tool.poetry.group.emacs]
optional = true
[tool.poetry.group.emacs.dependencies]
ipython = "*"
pyright = "1.1.345"

[tool.pytest.ini_options]
markers = [
    "slow: Slow tests",
]
log_cli = true
log_cli_level = "WARN"
